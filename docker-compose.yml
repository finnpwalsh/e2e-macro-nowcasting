services:
  nowcasting-dev-base:
    build:
      context: .
      dockerfile: infra/docker/base/Dockerfile
    image: nowcasting-dev-base:latest
    env_file: .env
    working_dir: /opt/project
    volumes:
      - .:/opt/project
      - ~/.aws:/root/.aws:ro
    environment:
      PYTHONPATH: /opt/project/src
      AWS_SHARED_CREDENTIALS_FILE: /root/.aws/credentials
    networks: [appnet]
  
  nowcasting-dev-prepare:
    build:
      context: .
      dockerfile: infra/docker/runtimes/prepare.Dockerfile
