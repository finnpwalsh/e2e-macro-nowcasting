x-airflow-env: &airflow_env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_URI}
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
  AIRFLOW__CORE__STORE_SERIALIZED_DAGS: "True"
  AIRFLOW__CORE__MIN_SERIALIZED_DAG_UPDATE_INTERVAL: "30"

  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}

  # project
  PYTHONPATH: /opt/project
  FRED_API_KEY: ${FRED_API_KEY}

  # MLflow (client)
  MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
  MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME}
  MLFLOW_REGISTRY_MODEL_NAME: ${MLFLOW_REGISTRY_MODEL_NAME}
  MLFLOW_MODEL_ALIAS: ${MLFLOW_MODEL_ALIAS}

  # AWS (keep one region var)
  AWS_SHARED_CREDENTIALS_FILE: /home/airflow/.aws/credentials
  AWS_REGION: ${AWS_REGION}

  # remote logging
  AIRFLOW__LOGGING__REMOTE_LOGGING: "True"
  AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: "s3://${AWS_S3_BUCKET_AIRFLOW_LOGS}/airflow/logs"
  AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: "aws_default"

x-airflow-volumes: &airflow_vols
  - ./:/opt/project
  - ./airflow/dags:/opt/airflow/dags
  - ~/.aws:/home/airflow/.aws:ro

x-airflow-image: &airflow_image
  image: e2e-macro-nowcasting-airflow:dev
  build:
    context: .
    dockerfile: infra/docker/Dockerfile.airflow

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [appnet]

  airflow-init:
    <<: *airflow_image
    depends_on:
      postgres:
        condition: service_healthy
    environment: *airflow_env
    volumes: *airflow_vols
    working_dir: /opt/project
    command:
      - bash
      - -lc
      - |
        airflow db migrate && \
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true && \
        airflow connections add aws_default \
          --conn-type aws \
          --conn-extra "{\"region_name\":\"${AWS_REGION}\"}" || true
    networks: [appnet]

  airflow-webserver:
    <<: *airflow_image
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes: *airflow_vols
    working_dir: /opt/project
    ports:
      - "8080:8080"
    command: bash -lc "airflow webserver"
    restart: unless-stopped
    networks: [appnet]

  airflow-scheduler:
    <<: *airflow_image
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes: *airflow_vols
    working_dir: /opt/project
    command: bash -lc "airflow scheduler"
    restart: unless-stopped
    networks: [appnet]

  mlflow:
    image: e2e-macro-nowcasting-mlflow:dev
    build:
      context: .
      dockerfile: infra/mlflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET_ARTIFACTS: ${AWS_S3_BUCKET_ARTIFACTS}
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI}
      AWS_SHARED_CREDENTIALS_FILE: /home/mlflow/.aws/credentials
    volumes:
      - ~/.aws:/home/mlflow/.aws:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5001:5000"
    command:
      - bash
      - -lc
      - |
        mlflow server \
        --host 0.0.0.0 \
        --port 5000 \
        --backend-store-uri ${MLFLOW_BACKEND_STORE_URI} \
        --default-artifact-root s3://${AWS_S3_BUCKET_ARTIFACTS}/mlflow
    restart: unless-stopped
    networks: [appnet]

volumes:
  postgres-db-volume:

networks:
  appnet:
    name: e2e-macro-nowcasting-net
