services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    image: e2e-macro-nowcasting:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
      PYTHONPATH: /opt/project
      FRED_API_KEY: ${FRED_API_KEY}
      MLFLOW_TRACKING_URI: "sqlite:////opt/project/artifacts/mlflow.db"
      MLFLOW_DEFAULT_ARTIFACT_ROOT: "file:///opt/project/artifacts/mlflow"
      AWS_PROFILE: ${AWS_PROFILE:-nowcasting-dev}
      AWS_DEFAULT_REGION: ${AWS_S3_REGION:-us-east-1}
      AWS_REGION: ${AWS_S3_REGION:-us-east-1}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/project
      - ~/.aws:/root/.aws:ro
      - ~/.aws:/home/airflow/.aws:ro
    command:
      - bash
      - -lc
      - |
        airflow db migrate && \
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    restart: "no"
    working_dir: "/opt/project"

  airflow-webserver:
    image: e2e-macro-nowcasting:dev
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./:/opt/project
      - ~/.aws:/root/.aws:ro
      - ~/.aws:/home/airflow/.aws:ro
    ports:
      - "8080:8080"
    command: bash -lc "airflow webserver"
    restart: unless-stopped
    working_dir: "/opt/project"

  airflow-scheduler:
    image: e2e-macro-nowcasting:dev
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./:/opt/project
      - ~/.aws:/root/.aws:ro
      - ~/.aws:/home/airflow/.aws:ro
    command: bash -lc "airflow scheduler"
    restart: unless-stopped
    working_dir: "/opt/project"

volumes:
  postgres-db-volume: