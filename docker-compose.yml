# ----------------------------------------------------------
# Shared Airflow Environment
# ----------------------------------------------------------
x-airflow-env: &airflow_env
  # Core
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_URI}
  AIRFLOW__CORE__DAGS_FOLDER: /opt/orchestration/airflow/dags
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
  AIRFLOW__CORE__STORE_SERIALIZED_DAGS: "True"
  AIRFLOW__CORE__MIN_SERIALIZED_DAG_UPDATE_INTERVAL: "30"
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}

  # Logging (LOCAL)
  AIRFLOW__LOGGING__REMOTE_LOGGING: "False"
  AIRFLOW__LOGGING__BASE_LOG_FOLDER: "/opt/airflow/logs"
  
  # Project
  PYTHONPATH: /opt/project/src
  STORAGE_BACKEND: ${STORAGE_BACKEND}

  # MLflow client
  MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
  MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME}
  
  # nowcast model registry settings
  NOWCAST_REGISTRY_MODEL: ${NOWCAST_REGISTRY_MODEL}
  NOWCAST_MODEL_ALIAS: ${NOWCAST_MODEL_ALIAS}

  # AWS
  AWS_REGION: ${AWS_REGION}
  AWS_DEFAULT_REGION: ${AWS_REGION}
  AWS_PROFILE: ${AWS_PROFILE}
  AWS_SHARED_CREDENTIALS_FILE: /home/airflow/.aws/credentials


# ----------------------------------------------------------
# Shared Volumes
# ----------------------------------------------------------
x-airflow-volumes: &airflow_vols
  - ./:/opt/project
  - ./orchestration/airflow/dags:/opt/orchestration/airflow/dags
  - ./orchestration/airflow/logs:/opt/airflow/logs
  - ~/.aws:/home/airflow/.aws:ro
  - /var/run/docker.sock:/var/run/docker.sock

# ----------------------------------------------------------
# Shared Airflow Image
# ----------------------------------------------------------
x-airflow-image: &airflow_image
  image: nowcasting-airflow:dev
  build:
    context: .
    dockerfile: infra/docker/services/airflow/Dockerfile

# ----------------------------------------------------------
# Services
# ----------------------------------------------------------
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [appnet]

  airflow-init:
    <<: *airflow_image
    depends_on:
      postgres:
        condition: service_healthy
    environment: *airflow_env
    volumes: *airflow_vols
    working_dir: /opt/project
    command:
      - bash
      - -lc
      - |
        airflow db migrate && \
        airflow users create \
          --username "${AIRFLOW_ADMIN_USERNAME}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL}" || true && \
        airflow connections add aws_default \
          --conn-type aws \
          --conn-extra "{\"region_name\":\"${AWS_REGION}\"}" || true
    networks: [appnet]

  airflow-webserver:
    <<: *airflow_image
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes: *airflow_vols
    working_dir: /opt/project
    ports:
      - "8080:8080"
    command: bash -lc "airflow webserver"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [appnet]

  airflow-scheduler:
    <<: *airflow_image
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes: *airflow_vols
    working_dir: /opt/project
    command: bash -lc "airflow scheduler"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type SchedulerJob --hostname \"$(hostname)\" || exit 1"
        ]
      interval: 20s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks: [appnet]

  mlflow:
    image: nowcasting-mlflow:dev
    build:
      context: .
      dockerfile: infra/docker/services/mlflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AWS_REGION: ${AWS_REGION}
      AWS_DEFAULT_REGION: ${AWS_REGION}
      AWS_PROFILE: ${AWS_PROFILE}
      AWS_SHARED_CREDENTIALS_FILE: /home/mlflow/.aws/credentials
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI}
      AWS_S3_BUCKET_ARTIFACTS: ${AWS_S3_BUCKET_ARTIFACTS}
    volumes:
      - ~/.aws:/home/mlflow/.aws:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:5000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5001:5000"
    command:
      - bash
      - -lc
      - |
        mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --backend-store-uri "${MLFLOW_BACKEND_STORE_URI}" \
          --default-artifact-root "s3://${AWS_S3_BUCKET_ARTIFACTS}/mlflow"
    restart: unless-stopped
    networks: [appnet]
  
  nowcasting-base:
    build:
      context: .
      dockerfile: infra/docker/base/Dockerfile
    image: nowcasting-base:latest


volumes:
  postgres-db-volume:

networks:
  appnet:
    name: e2e-macro-nowcasting-net
